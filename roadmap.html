<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap Power BI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>// <span>roadmap</span>.powerbi</h1>
  <div class="header-right">
    <button class="btn" onclick="toggleTheme()" id="theme-btn">☀️ tema</button>
  </div>
</header>

<!-- 🔥 LINK CORRIGIDO -->
<div class="back-link" style="padding:20px 32px;">
  <a href="/BICronograma/" class="btn">← voltar ao portfólio</a>
</div>

<section style="padding:0 32px;">
  <h2 style="color:var(--accent)">Roadmap Power BI</h2>
  <p style="color:var(--muted)">// 4 meses · 16 semanas</p>
</section>

<!-- PROGRESSO GLOBAL -->
<div style="margin:20px 32px;">
  <div style="display:flex; justify-content:space-between;">
    <span>// progresso</span>
    <span id="pct">0%</span>
  </div>

  <div style="background:var(--border); height:8px; border-radius:10px;">
    <div id="bar" style="height:100%; width:0%; background:var(--accent2); border-radius:10px;"></div>
  </div>
</div>

<!-- RESET -->
<div style="padding:0 32px 20px;">
  <button class="btn btn-accent" onclick="resetProgress()">resetar</button>
</div>

<!-- CONTEÚDO -->
<div id="grid" style="display:grid; gap:20px; padding:0 32px 40px;"></div>

<script>
/* ---------------- THEME ---------------- */
if (localStorage.getItem('theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('theme-btn').textContent = '🌙 tema';
}

function toggleTheme() {
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isLight ? '🌙 tema' : '☀️ tema';
}

/* ---------------- DATA ---------------- */
const data = [
  {
    month: "Mês 1 — Fundamentos",
    weeks: [
      "Introdução ao Power BI",
      "Tabelas fato e dimensão",
      "Power Query (ETL)",
      "Conexões com Excel e SQL"
    ]
  },
  {
    month: "Mês 2 — DAX",
    weeks: [
      "DAX básico",
      "CALCULATE e FILTER",
      "Visualizações",
      "Design de dashboards"
    ]
  },
  {
    month: "Mês 3 — Avançado",
    weeks: [
      "Storytelling",
      "DAX avançado",
      "Performance",
      "Projeto prático"
    ]
  },
  {
    month: "Mês 4 — Profissional",
    weeks: [
      "Power BI Service",
      "Automação",
      "Projeto portfólio",
      "Deploy"
    ]
  }
];

/* ---------------- RENDER ---------------- */
const grid = document.getElementById("grid");

data.forEach((m, mi) => {
  const card = document.createElement("div");
  card.style.background = "var(--card)";
  card.style.padding = "20px";
  card.style.borderRadius = "10px";

  const title = document.createElement("h3");
  title.textContent = m.month;

  card.appendChild(title);

  m.weeks.forEach((w, wi) => {
    const id = `c-${mi}-${wi}`;
    const saved = localStorage.getItem(id) === "true";

    const div = document.createElement("div");
    div.style.margin = "8px 0";

    div.innerHTML = `
      <label>
        <input type="checkbox" id="${id}" ${saved ? "checked" : ""} onchange="save('${id}')">
        ${w}
      </label>
    `;

    card.appendChild(div);
  });

  grid.appendChild(card);
});

/* ---------------- PROGRESS ---------------- */
function save(id) {
  const checked = document.getElementById(id).checked;
  localStorage.setItem(id, checked);
  update();
}

function update() {
  const all = document.querySelectorAll("input[type='checkbox']");
  let done = 0;

  all.forEach(c => {
    if (c.checked) done++;
  });

  const pct = Math.round((done / all.length) * 100);

  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("bar").style.width = pct + "%";
}

/* ---------------- RESET ---------------- */
function resetProgress() {
  localStorage.clear();
  location.reload();
}

update();
</script>

</body>
</html>
